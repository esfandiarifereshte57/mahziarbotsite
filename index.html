<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت منحل شده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            color: #ffcc00;
        }
        
        .message {
            font-size: 1.8rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }
        
        .signature {
            font-size: 1.5rem;
            font-style: italic;
            color: #ffcc00;
            margin-top: 30px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }
        
        .decoration {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        .circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 15px;
            animation: pulse 2s infinite;
            border: 2px solid rgba(255, 204, 0, 0.5);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .icon {
            font-size: 3rem;
            color: #ffcc00;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 1rem;
            opacity: 0.7;
        }
        
        /* انیمیشن برای متن */
        .animated-text {
            display: inline-block;
            animation: textGlow 2s infinite alternate;
        }
        
        @keyframes textGlow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ffcc00; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #ffcc00, 0 0 40px #ffcc00; }
        }
        
        /* ریسپانسیو بودن */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .message { font-size: 1.4rem; }
            .container { padding: 20px; margin: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="animated-text">توجه!</h1>
        
        <div class="decoration">
            <div class="circle">
                <div class="icon">⚠️</div>
            </div>
        </div>
        
        <p class="message"> بدانید مهزیار یک کلاهبردار و دروغگو هست و برنامه نویس نیست . با عرض پوزش، این سایت توسط سعدی ( سازنده ی این سایت ) منحل شده است.</p>
        
        <div class="decoration">
            <div class="circle">
                <div class="icon">🔒</div>
            </div>
        </div>
        
        <p class="signature">سعدی</p>
        
        <div class="footer">
            برای اطلاعات بیشتر با پشتیبانی تماس بگیرید.
        </div>
    </div>
</body>
</html>
